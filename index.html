<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taller Automotriz</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="script.js" defer></script>
</head>
<body>
  <!-- HEADER -->
  <header>
    <div class="logo">
      <img src="imagenes/logo1.png" alt="Logo Taller">
    </div>
    <nav>
      <ul>
        <li><a href="#inicio">Inicio</a></li>
        <li><a href="#servicios">Servicios</a></li>
        <li><a href="#nosotros">Nosotros</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <!-- HERO / CAROUSEL -->
  <section id="inicio" class="hero">
    <div class="carousel">
      <div class="slides">
        <img src="imagenes/slide1.jpg" alt="Taller 1">
        <img src="imagenes/slide2.jpg" alt="Taller 2">
        <img src="imagenes/slide3.jpg" alt="Taller 3">
      </div>
    </div>
    <div class="hero-text">
      <h1>Confianza y Seguridad para tu Vehículo</h1>
      <p>El mejor servicio automotriz con respaldo digital.</p>
    </div>
  </section>

  <!-- SECCIÓN SERVICIOS -->
  <section id="servicios" class="section">
    <h2>Nuestros Servicios</h2>
    <div id="services-container" class="grid"></div>
  </section>

  <!-- SECCIÓN NOSOTROS -->
  <section id="nosotros" class="section">
    <h2>Sobre Nosotros</h2>
    <div id="about-container"></div>
  </section>

  <!-- SECCIÓN CONTACTO -->
  <section id="contacto" class="section">
    <h2>Contacto</h2>
    <div id="contact-container"></div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2025 Taller Automotriz | Todos los derechos reservados</p>
  </footer>
</body>
</html>
