<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración</title>
  <link rel="stylesheet" href="admin.css">
  <script type="module" src="admin.js" defer></script>
  <link rel="icon" href="imagenes/logo1.png" />
</head>
<body>
  <!-- HEADER -->
  <header>
    <h1>Panel de Administración</h1>
    <nav>
      <a href="informacion.html" class="btn-info">Ver Información Guardada</a>
      <a href="catalogo.html" class="btn-catalogo">Ver Catálogo</a>
    </nav>
  </header>

  <!-- FORMULARIOS -->
  <main>
    <!-- Servicios -->
    <section>
      <h2>Servicios</h2>
      <form id="form-servicios" class="form">
        <input type="text" id="titulo-servicio" placeholder="Título del servicio" required>
        <textarea id="descripcion-servicio" placeholder="Descripción" required></textarea>
        <input type="text" id="imagen-servicio" placeholder="Nombre de imagen (ej: servicio1.png)">
        <button type="submit">Guardar Servicio</button>
      </form>
    </section>

    <!-- Nosotros -->
    <section>
      <h2>Nosotros</h2>
      <form id="form-nosotros" class="form">
        <input type="text" id="titulo-nosotros" placeholder="Título" required>
        <textarea id="descripcion-nosotros" placeholder="Descripción" required></textarea>
        <input type="text" id="imagen-nosotros" placeholder="Nombre de imagen (ej: equipo1.png)">
        <button type="submit">Guardar Información</button>
      </form>
    </section>

    <!-- Catálogo de Servicios -->
    <section>
      <h2>Catálogo de Servicios con Precios</h2>
      <form id="form-catalogo" class="form">
        <input type="text" id="nombre-servicio" placeholder="Nombre del servicio" required>
        <textarea id="descripcion-catalogo" placeholder="Descripción" required></textarea>
        <input type="number" id="precio-servicio" placeholder="Precio aproximado (MXN)" required>
        <input type="text" id="categoria-servicio" placeholder="Categoría (ej: Autos Deportivos)" required>
        <input type="text" id="imagen-catalogo" placeholder="Nombre de imagen (ej: catalogo1.png)">
        <button type="submit">Guardar Servicio en Catálogo</button>
      </form>
    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2025 ToPerformance | Panel Admin</p>
  </footer>
</body>
</html>
